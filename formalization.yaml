automation:
  methods:
    - method: "agent"
      models:
        - "gpt-6.1-sol"
        - "claude-opus-5-5"
        - "claude-sonnet-5-5"
        - "claude-fable-5-1"
      framework: >-
        Codex (GPT-6.1 Sol) and Claude Code (Claude Opus 5.5 coordinating,
        Claude Sonnet 5.5, Claude Fable 5.1), under the author's supervision.
      tool_setup: >-
        Lean 4 and Mathlib v4.35.0-rc2. Every public definition and theorem
        statement was written first, compared with the sources by an
        independent model review, and approved by the author before its
        proof was developed. Verification uses full builds from a clean
        checkout, axiom checks, and Mathlib-only comparator challenges checked
        with Lean's comparator and the independent kernel checkers bundled
        with the toolchain.
      cost:
        wall_time: "about one week of development (October 2026) plus release preparation"
        spend_usd: "not separately tracked (ChatGPT Pro and Claude Max subscriptions)"
        hardware: "one 8-CPU / 30 GB RAM Linux machine"
      prompting_notes: >-
        The author determined the scope and the statements, chose the proof
        routes, and approved every public statement. For coefficients A(t,x,v)
        a detailed proof plan following the adjoint-smoothing argument was
        written and independently reviewed before formalisation. Gaps in the
        printed proofs were filled by arguments proposed by the models and
        checked by separate model reviews before they were formalised.
  spend_usd: "not separately tracked (ChatGPT Pro and Claude Max subscriptions)"
  notes: >-
    All Lean code was written by the listed models under the supervision of
    the author. Every proof is checked by the Lean kernel; the library
    contains no sorry and no custom axiom. The comparator Challenge files
    contain one intentional theorem-body placeholder per theorem, proved by the
    corresponding Solution files.

fidelity:
  divergences: >-
    Solutions are classical (continuous on the closed cylinder, with continuous
    time, position-gradient and velocity-Hessian derivatives inside) and the
    inequality holds almost everywhere, as in the sources. For coefficients
    A(t,x,v) the source exponent p >= 1 + 128 d^2 (Lambda/lambda)^2 / 3 is the
    one produced by the proof; the source states the estimate for some p
    depending on d, lambda, Lambda. The parabolic Harnack inequality is the
    unit-cylinder form used in the companion paper. Where the sources omit
    steps, the omitted arguments are supplied in the formalisation.

review:
  status: "author-verified"
  reviewers:
    - "Amélie Loher"
  notes: >-
    Lean checks each proof against its formal statement. The author reviewed
    that the statements are the intended theorems. Each public statement was
    compared with the sources by independent model reviews before its proof
    was accepted, and the comparator declarations are checked mechanically.
    This is not external peer review.

alignment:
  - source: "From Döblin to Aleksandrov, Theorem 1.1"
    lean: "HypoellipticAleksandrov.KineticAleksandrov.kinetic_aleksandrov_timeVelocity"
    note: "Coefficients A(t,v); every p > 2d+1; constant depending only on d, lambda, Lambda, p."
  - source: "From Döblin to Aleksandrov, Corollary 1.3 (for Theorem 1.1)"
    lean: "HypoellipticAleksandrov.KineticAleksandrov.kinetic_aleksandrov_timeVelocity_localised"
    note: "The source norm restricted to the set where the solution is positive."
  - source: "From Döblin to Aleksandrov, Theorem 1.2"
    lean: "HypoellipticAleksandrov.KineticAleksandrov.kinetic_aleksandrov_autonomous"
    note: "Autonomous coefficients a(x,v), d = 1; every p > 1 + beta_*(Lambda/lambda)."
  - source: "From Döblin to Aleksandrov, Corollary 1.3 (for Theorem 1.2)"
    lean: "HypoellipticAleksandrov.KineticAleksandrov.kinetic_aleksandrov_autonomous_localised"
    note: "The localised form for autonomous coefficients."
  - source: "From Döblin to Aleksandrov, Appendix B"
    lean: "HypoellipticAleksandrov.KineticAleksandrov.existsUnique_bellmanAdjointExponent"
    note: "Existence and uniqueness of the homogeneous adjoint exponent beta_*."
  - source: "From Döblin to Aleksandrov, Proposition C.1"
    lean: "HypoellipticAleksandrov.KineticAleksandrov.kinetic_aleksandrov_autonomous_counterexample"
    note: "No threshold below 4d works uniformly in the ellipticity ratio."
  - source: "From Döblin to Aleksandrov, Theorem 9.1"
    lean: "HypoellipticAleksandrov.KineticAleksandrov.kinetic_holder_of_aleksandrov"
    note: "An Aleksandrov principle with data (p, C_A) implies interior Hölder continuity, for measurable A(t,x,v)."
  - source: "From Döblin to Aleksandrov, Corollaries 9.9 and 9.10"
    lean: "HypoellipticAleksandrov.KineticAleksandrov.kinetic_holder_timeVelocity"
    note: "Hölder continuity for coefficients A(t,v); the autonomous case is kinetic_holder_autonomous."
  - source: "From Döblin to Aleksandrov, Theorems 4.1 and 3.5"
    lean: "HypoellipticAleksandrov.Parabolic.parabolic_aleksandrov"
    note: "Krylov's parabolic Aleksandrov estimate; the Krylov–Safonov Harnack inequality is parabolic_harnack_unit_cylinder."
  - source: "We need ABP (https://weneedabp.github.io/kinetic.html)"
    lean: "HypoellipticAleksandrov.KineticAleksandrov.kinetic_aleksandrov_fullCoefficient"
    note: "Measurable coefficients A(t,x,v); explicit exponent p >= 1 + 128 d^2 (Lambda/lambda)^2 / 3; localised source."
  - source: "Kinetic Krylov–Safonov Hölder estimate"
    lean: "HypoellipticAleksandrov.KineticAleksandrov.kinetic_holder_fullCoefficient"
    note: "Interior Hölder continuity for measurable A(t,x,v), from the estimate above and Theorem 9.1."

