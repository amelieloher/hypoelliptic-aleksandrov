    Complete for the results listed in main_results. The kinetic solution class
    is the classical one of the sources: continuous on the closed cylinder,
    with continuous time, position-gradient and velocity-Hessian derivatives in
    the open cylinder, and the equation holding almost everywhere. Viscosity
    solutions are not covered.
