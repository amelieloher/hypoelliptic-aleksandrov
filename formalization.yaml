version: "v0.4"

project:
  name: "Kinetic Aleksandrov estimates"
  description: >-
    A Lean 4 / Mathlib formalisation of Aleksandrov maximum principles for
    kinetic equations d_t u + v.grad_x u - A : D_v^2 u = f in non-divergence form,
    with measurable, uniformly elliptic diffusion acting only in the velocity.
    For coefficients A(t,v) the estimate holds for every source exponent
    p > 2d+1; for autonomous coefficients a(x,v) in one space dimension for
    every p above a threshold 1 + beta_*(Lambda/lambda) < 4, where no exponent
    below 4 works uniformly in the ellipticity ratio; and for general
    measurable coefficients A(t,x,v) for every p >= 1 + 128 d^2 (Lambda/lambda)^2 / 3.
    In each case the estimate implies interior Hölder continuity of solutions;
    for coefficients A(t,x,v) this is the kinetic Krylov–Safonov theorem. The
    library also proves the parabolic Aleksandrov estimate of Krylov, the
    parabolic Harnack inequality of Krylov and Safonov, the terminal solution
    operators of the kinetic equation, and classical Dirichlet solvability on
    ellipsoidal cylinders. Hörmander's hypoellipticity theorem is taken from
    the formalisation hoermander-rothschild-stein.
  authors:
    - "Amélie Loher"
  responsible_maintainers:
    - "Amélie Loher"
  affiliations:
    - "Amélie Loher: All Souls College, University of Oxford"
  license: "Apache-2.0"
  funding:
    - "Amélie Loher acknowledges support from the Fondation Sciences Mathématiques de Paris."

classification:
  arxiv: ["math.AP", "math.PR"]
  msc2020: ["35K70", "35B50", "35B65", "35Q84", "35H10"]

